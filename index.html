<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background-color: #f5f1eb;
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        background-color: #f5f1eb;
      }

      #app-preloader-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 4px solid rgb(164 120 100 / 28%);
        border-top-color: #a47864;
        border-radius: 50%;
        animation: app-preloader-spin 700ms linear infinite;
      }

      @keyframes app-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-preloader-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader" role="status" aria-label="Loading application">
      <div id="app-preloader-spinner" aria-hidden="true"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
